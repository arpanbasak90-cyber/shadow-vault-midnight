name: ShadowVault CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile Compact Smart Contract & ZK Circuits
        run: npm run build:contract

      - name: Run Automated Test Suite (9 Assertions)
        run: npm test

      - name: Verify Preprod Deployment Script Syntax
        run: npm run deploy:preprod
